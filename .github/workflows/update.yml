name: update-data
on:
  schedule:
    - cron: "0 */6 * * *"   # UTC 0/6/12/18点 => 北京时间 8/14/20/凌晨2点
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: python fetch_data.py
      - name: Commit data.json if changed
        run: |
          git config user.name  "gid-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: auto-update data.json [skip ci]"
          git push
